<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airbnb Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="app.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
  <header class="bg-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-red-600 cursor-pointer">Airbnb Clone</h1>
      <nav>
        <button id="loginBtn" class="text-gray-700 hover:text-red-600 mr-4">Login</button>
        <button id="signupBtn" class="text-gray-700 hover:text-red-600">Sign Up</button>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <section id="listingsSection">
      <h2 class="text-xl font-semibold mb-4">Available Listings</h2>
      <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <!-- Listings will be rendered here -->
      </div>
    </section>

    <section id="authSection" class="hidden max-w-md mx-auto mt-8 bg-white p-6 rounded shadow">
      <h2 id="authTitle" class="text-lg font-semibold mb-4">Login</h2>
      <form id="authForm" class="space-y-4">
        <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border rounded" />
        <input type="password" id="password" placeholder="Password" required class="w-full px-3 py-2 border rounded" />
        <button type="submit" class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700 transition">Submit</button>
      </form>
      <p id="authToggle" class="mt-4 text-center text-sm text-gray-600 cursor-pointer hover:underline">Don't have an account? Sign Up</p>
      <p id="authMessage" class="mt-2 text-center text-sm text-red-600"></p>
    </section>
  </main>
</body>
</html>
